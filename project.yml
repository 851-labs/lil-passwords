# Source of truth for LilPasswords.xcodeproj. After editing, run `make project`.
name: LilPasswords
options:
  bundleIdPrefix: com.851labs
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  LilPasswordsKit:
    path: Packages/LilPasswordsKit
  # Only the `lilpw` CLI target depends on this — kept out of
  # Packages/LilPasswordsKit/Package.swift so LilpwCore (and the rest of
  # LilPasswordsKit) stays free of argument-parsing concerns; see
  # LilpwCore's own doc comments for the split between "logic" (testable,
  # no ArgumentParser) and "argument parsing" (the CLI target only).
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.5.0
targets:
  LilPasswords:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
        type: syncedFolder
      # SMAppService looks for an agent's launchd plist at exactly this path
      # inside the app bundle. See Agent/Support/com.851labs.lilpasswords.agent.plist.
      - path: Agent/Support/com.851labs.lilpasswords.agent.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: LilPasswordsKit
      # Both the agent and the CLI are secondary tools, not the app's own
      # executable, so both embed under Contents/Helpers rather than
      # alongside "Lil Passwords" in Contents/MacOS. They share one
      # destination/subpath deliberately: XcodeGen groups embedded
      # dependencies into one PBXCopyFilesBuildPhase per unique
      # (destination, subpath) pair, and two phases both named "Embed
      # Dependencies" turned out to serialize in a non-deterministic
      # order (see git history for the CI failure this caused). One
      # shared phase sidesteps that entirely.
      - target: LilPasswordsAgent
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: lilpw
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lil Passwords
        CFBundleName: Lil Passwords
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: Copyright © 2026 851 Labs. MIT License.
    settings:
      base:
        PRODUCT_NAME: Lil Passwords
        PRODUCT_BUNDLE_IDENTIFIER: com.851labs.lilpasswords
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/App.entitlements
  LilPasswordsAgent:
    type: tool
    platform: macOS
    sources:
      - path: Agent/Sources
        type: syncedFolder
    dependencies:
      - package: LilPasswordsKit
    settings:
      base:
        PRODUCT_NAME: LilPasswordsAgent
        PRODUCT_BUNDLE_IDENTIFIER: com.851labs.lilpasswords.agent
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/Agent.entitlements
        # Embedded by LilPasswords; don't also install a standalone copy into archives.
        SKIP_INSTALL: YES
  lilpw:
    type: tool
    platform: macOS
    sources:
      - path: CLI/Sources
        type: syncedFolder
    dependencies:
      - package: LilPasswordsKit
      - package: LilPasswordsKit
        product: LilpwCore
      - package: ArgumentParser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: lilpw
        PRODUCT_BUNDLE_IDENTIFIER: com.851labs.lilpasswords.cli
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/CLI.entitlements
        # Embedded by LilPasswords; don't also install a standalone copy into archives.
        SKIP_INSTALL: YES
schemes:
  LilPasswords:
    build:
      targets:
        LilPasswords: all
        LilPasswordsAgent: all
        lilpw: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
