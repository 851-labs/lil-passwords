# Source of truth for LilPasswords.xcodeproj. After editing, run `make project`.
name: LilPasswords
options:
  bundleIdPrefix: com.851labs
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  LilPasswordsKit:
    path: Packages/LilPasswordsKit
  # Only the `lilpass` CLI target depends on this — kept out of
  # Packages/LilPasswordsKit/Package.swift so LilpassCore (and the rest of
  # LilPasswordsKit) stays free of argument-parsing concerns; see
  # LilpassCore's own doc comments for the split between "logic" (testable,
  # no ArgumentParser) and "argument parsing" (the CLI target only).
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.5.0
  # Pinned exact version so scripts/release/generate-appcast.sh can read the
  # same version out of Package.resolved and fetch matching `generate_appcast`/
  # `generate_keys` binaries. Bump deliberately, not via a version range.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  LilPasswords:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
        type: syncedFolder
      # AppIcon (851-2426) and the Localizable.xcstrings string catalog — kept out of
      # App/Sources/syncedFolder above so an asset catalog / string catalog can't get accidentally
      # swept up in Swift-file-oriented tooling that walks that folder; `buildPhase: resources`
      # spells out explicitly that these belong in "Copy Bundle Resources", not compiled sources,
      # rather than relying on XcodeGen's own by-extension guess.
      - path: App/Resources
        buildPhase: resources
      # SMAppService looks for an agent's launchd plist at exactly this path
      # inside the app bundle. See Agent/Support/com.851labs.lilpasswords.agent.plist.
      - path: Agent/Support/com.851labs.lilpasswords.agent.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: LilPasswordsKit
      # 851-2445: `AgentTophatDebugMenu` (DEBUG-only, App/Sources/AgentTophatDebugMenu.swift) calls `LilpassCommands`
      # directly — the same argument-parser-free logic `lilpass get` itself calls (CLI/Sources/
      # Commands/GetCommand.swift) — against an in-process, in-memory `AgentServer`, to produce a
      # real "denied request"/"allowlist filtering" transcript without needing a genuinely separate
      # `lilpass` process (which can't reach an in-memory helper: macOS requires a launchd plist to
      # reserve a *named* Mach service before any process can host one, confirmed empirically while
      # designing this capture). `LilpassCore` has no ArgumentParser dependency of its own — see its
      # own doc comments — so this doesn't pull argument-parsing machinery into the shipped app.
      - package: LilPasswordsKit
        product: LilpassCore
      - package: Sparkle
      # Both the agent and the CLI are secondary tools, not the app's own
      # executable, so both embed under Contents/Helpers rather than
      # alongside "lil passwords" in Contents/MacOS. They share one
      # destination/subpath deliberately: XcodeGen groups embedded
      # dependencies into one PBXCopyFilesBuildPhase per unique
      # (destination, subpath) pair, and two phases both named "Embed
      # Dependencies" turned out to serialize in a non-deterministic
      # order (see git history for the CI failure this caused). One
      # shared phase sidesteps that entirely.
      - target: LilPasswordsAgent
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: lilpass
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # 851-2441: an app extension embeds into Contents/PlugIns, not Contents/Helpers —
      # `destination: plugins` is XcodeGen's name for that PBXCopyFilesBuildPhase dstSubfolderSpec,
      # distinct from the `wrapper`/`Contents/Helpers` pair the two tool targets above share.
      - target: AutoFillExtension
        embed: true
        codeSign: true
        copy:
          destination: plugins
    # 851-2465: `codeSign: true` above re-signs each embedded helper tool right after copying it
    # into Contents/Helpers, but that re-sign doesn't know about (and so discards) the `-i`
    # identifier `LilPasswordsAgent`/`lilpass`'s own `OTHER_CODE_SIGN_FLAGS` gave it — both bare
    # `com.apple.product-type.tool` binaries with no Info.plist, so codesign has nothing but the
    # file name to fall back to. Re-sign them again here, explicitly, with the identifiers
    # `AgentConnectionSecurity` (Packages/LilPasswordsKit) actually requires from a real signed
    # build — see that file, and the matching comment on each tool target's
    # `OTHER_CODE_SIGN_FLAGS`, for what silently breaks otherwise: the app and the agent reject
    # every connection from each other, surfacing as the "Couldn't reach lil passwords' background
    # helper." error and `lilpass`'s "connection ... was invalidated". Runs as `postBuildScripts` —
    # after the embed/copy phase above, but still before Xcode's own final CodeSign of the app
    # itself, so the app's seal covers these corrected signatures, not the discarded ones.
    postBuildScripts:
      - name: Re-sign embedded helpers with their own bundle identifiers (851-2465)
        script: |
          set -euo pipefail
          HELPERS="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Helpers"
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-$CODE_SIGN_IDENTITY}"
          codesign --force -o runtime --timestamp=none \
            --sign "$IDENTITY" --identifier com.851labs.lilpasswords.agent \
            --entitlements "$SRCROOT/Config/Entitlements/Agent.entitlements" \
            "$HELPERS/LilPasswordsAgent"
          codesign --force -o runtime --timestamp=none \
            --sign "$IDENTITY" --identifier com.851labs.lilpasswords.cli \
            --entitlements "$SRCROOT/Config/Entitlements/CLI.entitlements" \
            "$HELPERS/lilpass"
          # 851-2441: the embed step's own "Code Sign On Copy" re-signs AutoFill.appex with a bare
          # `codesign --sign -`, ad hoc and with no entitlements at all (confirmed: `codesign -dvv
          # --entitlements :-` on the copied bundle showed none) — the same gap the two re-signs
          # above exist to fix, just for an app extension instead of a bare tool. Re-sign it here,
          # explicitly, with its real entitlements (Config/Entitlements/AutoFillExtension.entitlements)
          # so a real Apple Development/Developer ID identity (once 851-2400 lands a provisioning
          # profile) would seal them the same way this whole app is sealed — without this, even a
          # correctly-provisioned build would silently ship an extension with no
          # autofill-credential-provider/app-sandbox entitlements at all. `codesign` itself has no
          # provisioning-profile check (that's an Xcode build-system/AMFI concern, not this tool's),
          # so this succeeds today under ad-hoc signing exactly like the two re-signs above.
          PLUGINS="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/PlugIns"
          codesign --force -o runtime --timestamp=none \
            --sign "$IDENTITY" --identifier com.851labs.lilpasswords.autofill \
            --entitlements "$SRCROOT/Config/Entitlements/AutoFillExtension.entitlements" \
            "$PLUGINS/AutoFill.appex"
        basedOnDependencyAnalysis: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: lil passwords
        CFBundleName: lil passwords
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: Copyright © 2026 851 Labs. MIT License.
        # Sparkle (851-2437). Feed and DMG both live on GitHub Releases; see
        # docs/releasing.md. SUPublicEDKey is a build setting placeholder
        # (Config/Base.xcconfig) until `generate_keys` produces a real one.
        SUFeedURL: https://github.com/851-labs/lil-passwords/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_NAME: lil passwords
        PRODUCT_BUNDLE_IDENTIFIER: com.851labs.lilpasswords
        # 851-2426: App/Resources/Assets.xcassets/AppIcon.appiconset — generated by
        # scripts/icon/generate_icon.swift, never hand-edited.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/App.entitlements
        # 851-2465: the "Re-sign embedded helpers" postBuildScript above needs to read
        # Config/Entitlements/{Agent,CLI}.entitlements and re-codesign the already-copied helper
        # binaries in place — Config/Base.xcconfig's project-wide `ENABLE_USER_SCRIPT_SANDBOXING =
        # YES` blocks exactly that (tried declaring them as the script's `inputFiles`/`outputFiles`
        # instead: since Xcode's own implicit CodeSign-on-copy step for those same two files already
        # produces them, declaring this script as also producing them created a dependency cycle).
        # Scoped to this target only — LilPasswordsAgent/lilpass have no script phases of their own.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # 851-2426 localization pass: lets the build extract `String(localized:)` call sites into
        # .stringsdata, so Xcode's String Catalog editor (and `xcodebuild -exportLocalizations`)
        # can merge them into App/Resources/Localizable.xcstrings. Off by default for new targets
        # in some Xcode versions; without it, only SwiftUI's own auto-localized Text()/Button()
        # literals (which don't need this flag) were being picked up.
        SWIFT_EMIT_LOC_STRINGS: YES
  LilPasswordsAgent:
    type: tool
    platform: macOS
    sources:
      - path: Agent/Sources
        type: syncedFolder
    dependencies:
      - package: LilPasswordsKit
    settings:
      base:
        PRODUCT_NAME: LilPasswordsAgent
        PRODUCT_BUNDLE_IDENTIFIER: com.851labs.lilpasswords.agent
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/Agent.entitlements
        # Embedded by LilPasswords; don't also install a standalone copy into archives.
        SKIP_INSTALL: YES
        # 851-2465: this target is a bare `com.apple.product-type.tool` with
        # GENERATE_INFOPLIST_FILE = NO (Config/Base.xcconfig, and turning it on for a `tool`
        # product type doesn't help either — tried it: Xcode never embeds the resulting Info.plist
        # into a non-bundle Mach-O, so `otool -s __TEXT __info_plist` on the result is still empty).
        # With no CFBundleIdentifier anywhere in the binary, codesign silently falls back to the
        # executable's own file name ("LilPasswordsAgent") as its `-i` identifier instead of
        # PRODUCT_BUNDLE_IDENTIFIER above.
        #
        # That mismatch is invisible in ad-hoc/unsigned DEBUG builds
        # (`AgentConnectionSecurity.Requirement.developmentFallback` skips the check entirely), but
        # a real Apple Development/Developer ID-signed build enforces
        # `identifier "com.851labs.lilpasswords.agent"` (`AgentConnectionSecurity.PeerIdentifier`)
        # and rejects every connection — surfacing as the app's own "Couldn't reach lil passwords'
        # background helper." error and `lilpass`'s "connection ... was invalidated" — confirmed via
        # a real signed install to /Applications during 851-2465's smoke test.
        #
        # `OTHER_CODE_SIGN_FLAGS` fixes *this target's own* codesign invocation, which is enough for
        # anyone running this standalone build product directly — but NOT enough on its own for the
        # shipped app: `LilPasswords`'s "Embed Dependencies" copy phase below (`codeSign: true`)
        # re-signs its own copy of this binary from scratch afterward, using the embedding app
        # target's codesign invocation rather than this one, discarding this `-i` again. See
        # `LilPasswords`'s `postBuildScripts` (below) for the fix that actually reaches the shipped,
        # embedded copy at Contents/Helpers.
        OTHER_CODE_SIGN_FLAGS: -i com.851labs.lilpasswords.agent
        # 851-2465: the identifier fixes above are necessary but weren't sufficient — a real signed
        # install still failed with `SMAppService`'s launchd job stuck "spawn scheduled"/"spawn
        # failed", `last exit reason = OS_REASON_CODESIGNING`, and `launchctl print`'s LWCR showing
        # an *empty* allowed-cdhash set (`"cdhash" => {"$in" => []}`) — `smd` couldn't compute a
        # valid lightweight code requirement because this binary has no Info.plist at all
        # (`codesign -dvv` shows `Info.plist=not bound`), so it produced one that rejects every
        # signature, including a perfectly valid one, and launchd kills the process before `main()`
        # ever runs. Linking Agent/Support/Info.plist directly into `__TEXT,__info_plist` — the same
        # technique Apple's own SMAppService/helper-tool sample code uses for non-bundle executables
        # — gives `smd` a real CFBundleIdentifier/bundle version to key its LWCR from. Confirmed via
        # a real signed install: without this, `launchctl print` shows the empty-cdhash LWCR and
        # `OS_REASON_CODESIGNING` kills; with it, the agent actually spawns and answers XPC calls.
        OTHER_LDFLAGS: -Wl,-sectcreate,__TEXT,__info_plist,$(SRCROOT)/Agent/Support/Info.plist
  lilpass:
    type: tool
    platform: macOS
    sources:
      - path: CLI/Sources
        type: syncedFolder
    dependencies:
      - package: LilPasswordsKit
      - package: LilPasswordsKit
        product: LilpassCore
      # `lilpass mcp` (851-2431). Depends transitively on the swift-sdk `MCP` product declared in
      # Packages/LilPasswordsKit/Package.swift — no separate top-level `packages:` entry needed
      # here, SwiftPM resolves that through LilpassMCP's own dependency graph.
      - package: LilPasswordsKit
        product: LilpassMCP
      - package: ArgumentParser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: lilpass
        PRODUCT_BUNDLE_IDENTIFIER: com.851labs.lilpasswords.cli
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/CLI.entitlements
        # Embedded by LilPasswords; don't also install a standalone copy into archives.
        SKIP_INSTALL: YES
        # 851-2465: see the matching comment on `LilPasswordsAgent`'s `OTHER_CODE_SIGN_FLAGS`
        # above — same bare-tool/no-Info.plist gap left this signed as plain "lilpass" instead of
        # `com.851labs.lilpasswords.cli`, which `AgentConnectionSecurity` (the agent's listener-side
        # peer check) requires from a real signed build. `LilPasswords`'s `postBuildScripts` fixes
        # the shipped, embedded copy at Contents/Helpers that this alone doesn't reach.
        OTHER_CODE_SIGN_FLAGS: -i com.851labs.lilpasswords.cli
        # 851-2465: see the matching comment on `LilPasswordsAgent`'s `OTHER_LDFLAGS` above. `lilpass`
        # isn't SMAppService-managed itself so the empty-LWCR/OS_REASON_CODESIGNING failure doesn't
        # apply to it directly, but it gets the same treatment for consistency and so its identifier
        # doesn't depend solely on `OTHER_CODE_SIGN_FLAGS -i`.
        OTHER_LDFLAGS: -Wl,-sectcreate,__TEXT,__info_plist,$(SRCROOT)/CLI/Support/Info.plist
  # 851-2441: the AutoFill credential provider extension. See
  # docs/adr/0005-autofill-credential-provider.md and Config/Entitlements/AutoFillExtension.entitlements's
  # own comments for the trust model and the provisioning-profile blocker (this target builds and
  # embeds fine for CI, but can't actually register as a provider locally without a real profile).
  AutoFillExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: AutoFillExtension/Sources
        type: syncedFolder
      # A separate bundle from `LilPasswords` (own Info.plist, own Contents/PlugIns location), so
      # it can't share App/Resources/Localizable.xcstrings — needs its own String Catalog for the
      # `String(localized:)` call sites CredentialProviderViewController.swift makes to actually be
      # catalog-tracked/translatable rather than just falling back to their English literal.
      - path: AutoFillExtension/Resources
        buildPhase: resources
    dependencies:
      - package: LilPasswordsKit
    info:
      path: AutoFillExtension/Support/Info.plist
      properties:
        CFBundleDisplayName: AutoFill
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          # 851-2475: XcodeGen regenerates AutoFillExtension/Support/Info.plist from exactly these
          # `properties` on every `make project`/`xcodegen generate` (including release.sh's), so
          # anything declared only in the plist file itself is silently dropped. Without these
          # capabilities macOS won't offer the extension for passwords or passkeys at all.
          # scripts/release/verify-autofill-plist.sh asserts they survive into the built appex.
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              # 851-2442: macOS 14+ only, but this key is simply ignored by macOS 13 (which never
              # calls the ASPasskeyCredentialRequest-based overrides in
              # CredentialProviderViewController.swift at all) — no #available-style gate needed
              # in a plist.
              ProvidesPasskeys: true
    settings:
      base:
        # Deliberately "AutoFill", not e.g. "LilPasswordsAutoFill" — this is also what makes the
        # access log's process-chain resolution (`CallerIdentityResolver`) render this caller as
        # "AutoFill" for free, matching the ticket's "log it in the access log as AutoFill"
        # requirement with no code of its own.
        PRODUCT_NAME: AutoFill
        PRODUCT_BUNDLE_IDENTIFIER: com.851labs.lilpasswords.autofill
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/AutoFillExtension.entitlements
        SKIP_INSTALL: YES
        # Mirrors the LilPasswords app target's own SWIFT_EMIT_LOC_STRINGS comment: lets the build
        # extract this target's own String(localized:) call sites into
        # AutoFillExtension/Resources/Localizable.xcstrings.
        SWIFT_EMIT_LOC_STRINGS: YES
        # 851-2441: Xcode's build system refuses to build ANY app extension target under
        # CODE_SIGN_STYLE = Manual (Config/Base.xcconfig, shared by every target) without an
        # embedded provisioning profile — "requires a provisioning profile. Enable development
        # signing..." — regardless of identity, because
        # `com.apple.developer.authentication-services.autofill-credential-provider` is a
        # *restricted* entitlement (confirmed empirically; see
        # Config/Entitlements/AutoFillExtension.entitlements and
        # docs/adr/0005-autofill-credential-provider.md). No such profile exists until 851 Labs'
        # Apple Developer Program team is set up (851-2400), so — per that ADR and the ticket's
        # explicit "document rather than silently skip" instruction — this disables Xcode's own
        # codesign step for just this one target's build, rather than dropping the entitlement.
        # The plain `codesign` CLI invoked afterward (this target's `copy: destination: plugins,
        # codeSign: true` embed step in the LilPasswords target, and the "re-sign embedded
        # helpers" postBuildScript pattern already used for LilPasswordsAgent/lilpass) has no such
        # profile requirement — it ad-hoc-signs the entitlements plist directly, same as every
        # other target here — so `make build`/CI still produce a fully-embedded .appex. AMFI will
        # still refuse to actually *load* it as a credential provider without a real profile; see
        # the ADR for what that means for local tophat verification.
        CODE_SIGNING_ALLOWED: NO
schemes:
  LilPasswords:
    build:
      targets:
        LilPasswords: all
        LilPasswordsAgent: all
        lilpass: all
        AutoFillExtension: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
