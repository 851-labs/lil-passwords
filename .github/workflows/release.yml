name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, and publish release
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Ad hoc signed and unnotarized until a Developer ID certificate exists
      # — every secret below is optional today. See docs/releasing.md and
      # 851-2436/851-2437: once DEVELOPER_ID_CERT_P12/DEVELOPER_ID_CERT_PASSWORD
      # (and notary credentials) exist in the repo/org secrets, this workflow
      # switches to Developer ID signing + notarization + stapling
      # automatically, with no code changes needed. APPLE_TEAM_ID defaults to
      # Alexandru Turcanu's team (WH4QW9ND3J, 851-2400/PR #16), which is who
      # lil passwords ships under until the 851 Labs org has its own team —
      # only set this secret to override that default.
      DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
      DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
      NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version

      # Same method as .github/workflows/ci.yml, so both workflows install
      # whatever XcodeGen version Homebrew currently serves.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            Packages/LilPasswordsKit/.build
            build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build, sign, package, notarize, and generate appcast
        run: scripts/release/release.sh

      - name: Publish GitHub Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi

          ASSETS=(dist/*.dmg)
          if [[ -f dist/appcast.xml ]]; then
            ASSETS+=(dist/appcast.xml)
          else
            echo "::warning::dist/appcast.xml was not generated (SPARKLE_ED_PRIVATE_KEY unset?) — Sparkle feed not updated for $TAG."
          fi
          gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      # 851-2438: keeps 851-labs/homebrew-tap's Casks/lil-passwords.rb in sync
      # with each release. Same "degrade gracefully" pattern as the rest of
      # this pipeline (see docs/releasing.md) — HOMEBREW_TAP_TOKEN is
      # optional, and its absence is a warning, not a failure. It needs to be
      # a token (fine-grained PAT with contents + pull-requests write on
      # 851-labs/homebrew-tap, or a classic PAT with `repo`) rather than the
      # job's own GITHUB_TOKEN, which has no access outside this repo.
      - name: Bump Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set — skipping the 851-labs/homebrew-tap cask bump for ${GITHUB_REF_NAME}. See docs/releasing.md."
            exit 0
          fi

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DMG="dist/LilPasswords-${VERSION}.dmg"
          if [[ ! -f "$DMG" ]]; then
            echo "::error::$DMG not found — did the build step run?"
            exit 1
          fi
          SHA256="$(shasum -a 256 "$DMG" | awk '{print $1}')"

          TAP_DIR="$(mktemp -d)"
          gh repo clone 851-labs/homebrew-tap "$TAP_DIR"
          cd "$TAP_DIR"

          CASK="Casks/lil-passwords.rb"
          if [[ ! -f "$CASK" ]]; then
            echo "::error::$CASK not found in 851-labs/homebrew-tap."
            exit 1
          fi

          sed -i '' -E "s/^( *version \")[^\"]*(\")/\1${VERSION}\2/" "$CASK"
          sed -i '' -E "s/^( *sha256 \")[^\"]*(\")/\1${SHA256}\2/" "$CASK"

          if git diff --quiet -- "$CASK"; then
            echo "$CASK is already at ${VERSION} — nothing to bump."
            exit 0
          fi

          git config user.name "851 Labs Release Bot"
          git config user.email "release-bot@851labs.dev"

          BRANCH="bump-lil-passwords-${VERSION}"
          git checkout -b "$BRANCH"
          git commit -am "lil-passwords ${VERSION}"
          git push origin "$BRANCH"
          gh pr create --repo 851-labs/homebrew-tap \
            --title "lil-passwords ${VERSION}" \
            --body "Automated bump from 851-labs/lil-passwords@${TAG}." \
            --head "$BRANCH" --base main
