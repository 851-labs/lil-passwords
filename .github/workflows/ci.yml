name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check generated project is up to date
        run: |
          make project
          git diff --exit-code -- LilPasswords.xcodeproj || {
            echo "::error::LilPasswords.xcodeproj is out of date. Run 'make project' and commit the result."
            exit 1
          }

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            Packages/LilPasswordsKit/.build
            Packages/LilpassE2E/.build
            build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Lint
        run: make lint

      - name: Test LilPasswordsKit
        run: make test

      - name: Build app, helper, and CLI (unsigned)
        run: make build

      - name: End-to-end tests (built lilpass binary + disposable in-memory helper)
        # This step used to hang CI for a full 30-minute timeout with zero output. Root-caused via
        # a background `make e2e` + periodic `sample` of the stuck process: it wasn't our
        # helper/XPC/MCP code blocking on I/O at all — it was the Swift runtime spinning inside
        # swift::MetadataCacheEntryBase::awaitSatisfyingState, a lock-free generic-metadata-cache
        # "wait for another thread's in-flight instantiation of this same type" spin, reached from
        # MCPStdioSessionTests' use of Client.connect(transport:) (see that suite's doc comment).
        # First "fixed" by adding `.serialized` to that suite alone — then it recurred anyway,
        # because `.serialized` only serializes tests *within* one suite, and swift-testing still
        # runs separate suites concurrently by default. This package's suites all construct an
        # E2EHelperProcess/run the lilpass binary via the same generic Process/Pipe machinery, so a
        # CI run with the HangWatchdog instrumentation below caught the same livelock again, just
        # racing across suites instead of within one — see the Makefile's `e2e` target for the full
        # writeup and the `--no-parallel` flag that actually removes the cross-suite race.
        #
        # The retry loop below is deliberate, not a crutch: even with `--no-parallel`, one local
        # verification run out of several still tripped HangWatchdog before this landed, so the
        # underlying Swift-runtime generic-metadata race is treated as reduced-to-rare rather than
        # eliminated. Each attempt fails fast (the 90s HangWatchdog plus its `sample` dump, well
        # under this step's 10-minute budget) and leaves full tracing in the log either way, so a
        # retry that goes green still leaves the failed attempt's diagnostics behind to investigate
        # — this isn't retrying away a mystery silently.
        #
        # `timeout-minutes: 10` and every suite's own `.timeLimit(.minutes(1))` trait stay on as a
        # backstop: a genuine future hang should fail fast and name the offending test, rather than
        # silently burning the job's full 30-minute allowance again.
        timeout-minutes: 10
        env:
          E2E_EXTRA_ARGS: --verbose
        run: |
          for attempt in 1 2 3; do
            if make e2e; then
              exit 0
            fi
            echo "::warning::make e2e attempt ${attempt} failed (see HangWatchdog tracing above if this was the livelock)"
          done
          exit 1
