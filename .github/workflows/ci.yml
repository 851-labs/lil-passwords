name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check generated project is up to date
        run: |
          xcodegen generate
          git diff --exit-code -- LilPasswords.xcodeproj || {
            echo "::error::LilPasswords.xcodeproj is out of date. Run 'make project' and commit the result."
            exit 1
          }

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            Packages/LilPasswordsKit/.build
            build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Lint
        run: make lint

      - name: Test LilPasswordsKit
        run: make test

      - name: Build app, helper, and CLI (unsigned)
        run: make build
