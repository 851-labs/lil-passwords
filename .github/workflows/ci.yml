name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check generated project is up to date
        run: |
          make project
          git diff --exit-code -- LilPasswords.xcodeproj || {
            echo "::error::LilPasswords.xcodeproj is out of date. Run 'make project' and commit the result."
            exit 1
          }

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            Packages/LilPasswordsKit/.build
            Packages/LilpassE2E/.build
            build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Lint
        run: make lint

      - name: Test LilPasswordsKit
        run: make test

      - name: Build app, helper, and CLI (unsigned)
        run: make build

      - name: End-to-end tests (built lilpass binary + disposable in-memory helper)
        # This step used to hang CI for a full 30-minute timeout with zero output — 851-2434.
        # Root-caused via a background `make e2e` + periodic `sample` of the stuck process, across
        # several wrong-or-partial turns before landing on the real, stacked causes; see
        # `Packages/LilpassE2E/Tests/LilpassE2ETests/MCPStdioSessionTests.swift`'s doc comment for the
        # full diagnostic history. Short version: it wasn't test/suite parallelism (`.serialized` and
        # `--no-parallel`, both still on below, guard against a *real* but different race and were
        # never actually why this hung). It was that suite's own teardown, in two independent ways —
        # a leaked MCP `Client` background `Task` from a missing `disconnect()` call, and a blocking
        # `Process.waitUntilExit()` call starving Swift Concurrency's cooperative thread pool from
        # inside `async` code — both now fixed there.
        #
        # The retry loop below stays on as defense in depth, not because either fix above is expected
        # to be incomplete, but because this step burned enough investigation time already that
        # failing fast with full diagnostics beats a silent 30-minute stall if something new ever
        # shows up here. Each attempt fails fast (the 90s HangWatchdog plus its `sample` dump, well
        # under this step's 10-minute budget) and leaves full tracing in the log either way, so a
        # retry that goes green still leaves the failed attempt's diagnostics behind to investigate.
        #
        # `timeout-minutes: 10` and every suite's own `.timeLimit(.minutes(1))` trait stay on as a
        # backstop: a genuine future hang should fail fast and name the offending test, rather than
        # silently burning the job's full 30-minute allowance again.
        timeout-minutes: 10
        env:
          E2E_EXTRA_ARGS: --verbose
        run: |
          for attempt in 1 2 3; do
            if make e2e; then
              exit 0
            fi
            echo "::warning::make e2e attempt ${attempt} failed (see HangWatchdog tracing above if this was the livelock)"
          done
          exit 1
